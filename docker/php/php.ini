; Limites de subida. Imagenes hasta 5 MB y respaldos .sql hasta 250 MB.
; OJO: estos limites viven en cuatro sitios que deben cambiarse juntos.
; Ver docs/00-entorno.md y la regla registrada para docker/**.
upload_max_filesize = 256M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

date.timezone = America/Bogota
