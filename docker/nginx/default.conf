server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Debe acompañar a upload_max_filesize/post_max_size de docker/php/php.ini.
    client_max_body_size 300M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300s;

        # Con el build, AddLinkHeadersForPreloadedAssets manda una cabecera
        # `Link` con cada chunk que precarga la página; en el tablero pasa de
        # los 4k por defecto y Nginx responde 502 («upstream sent too big
        # header»). Solo se ve sin `public/hot`, es decir, en producción.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
